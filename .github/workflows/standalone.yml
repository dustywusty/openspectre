name: Standalone game
on: [push, pull_request]
permissions:
  contents: read
jobs:
  no-disc:
    runs-on: ubuntu-latest
    outputs:
      recording: ${{ steps.recording.outputs.artifact-url }}
      recording-id: ${{ steps.recording.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run build
      - run: git diff --exit-code -- assets/open/generated
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run test:open:record
      - name: Upload playthrough evidence
        id: recording
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playthrough-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/playthrough/
          retention-days: 30
          if-no-files-found: warn
      - name: Link recording in build summary
        if: always() && steps.recording.outputs.artifact-url != ''
        env:
          RECORDING_URL: ${{ steps.recording.outputs.artifact-url }}
        run: |
          {
            echo "### Gameplay evidence"
            echo "[Download MP4 recordings and screenshots]($RECORDING_URL) (30-day retention; GitHub sign-in required)."
            echo "Real WASM frames; silent, without browser HUD. Beacon navigation uses labeled infinite health. Partial clips can survive failed checks; consult the run result."
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run test:open-network
  pr-recording:
    needs: no-disc
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.no-disc.outputs.recording != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.no-disc.outputs.recording-id }}
          path: playthrough
          merge-multiple: true
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RECORDING_URL: ${{ needs.no-disc.outputs.recording }}
          CHECK_RESULT: ${{ needs.no-disc.result }}
        with:
          script: |
            const fs = require('node:fs');
            const files = [
              ['01-combat.mp4', 'video/mp4'],
              ['02-death.mp4', 'video/mp4'],
              ['03-beacon-mission.mp4', 'video/mp4'],
              ['cockpit.png', 'image/png'],
              ['chase.png', 'image/png'],
              ['overhead.png', 'image/png'],
            ];
            const media = {};
            // Upload bytes only. This job never checks out or executes PR code.
            for (const [name, type] of files) {
              const path = `playthrough/${name}`;
              if (!fs.existsSync(path) || fs.statSync(path).size === 0) continue;
              const data = fs.readFileSync(path);
              const query = new URLSearchParams({
                name, content_type: type,
                repository_id: String(context.payload.repository.id),
              });
              const response = await github.request(`POST https://uploads.github.com/user-attachments/assets?${query}`, {
                data,
                headers: {'content-type': 'application/octet-stream', 'content-length': String(data.length)},
              });
              if (!response.data.url) throw new Error(`No attachment URL for ${name}`);
              media[name] = response.data.url;
            }
            const clips = [
              ['01-combat.mp4', 'Cannon combat · normal health'],
              ['02-death.mp4', 'Enemy damage and death · normal health'],
              ['03-beacon-mission.mp4', 'Beacon mission · infinite health navigation test'],
            ].filter(([name]) => media[name])
              .map(([name, caption]) => `**${caption}**\n\n${media[name]}`).join('\n\n');
            const screenshots = ['cockpit', 'chase', 'overhead']
              .filter(name => media[`${name}.png`])
              .map(name => `![${name} camera](${media[`${name}.png`]})`).join('\n\n');
            const marker = '<!-- openspectre-playthrough -->';
            const body = `${marker}
            **Gameplay recording** · commit ${context.payload.pull_request.head.sha}
            Build result: **${process.env.CHECK_RESULT}**

            Actual WASM framebuffer captures. Silent, without the browser HUD or native desktop interface. Failed tests may leave partial clips.

            ${clips}

            ${screenshots}

            <details>
            <summary>Build details and original files</summary>

            [Build log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) · [Original recordings](${process.env.RECORDING_URL}) (30-day retention).

            </details>`;
            const params = {...context.repo, issue_number: context.issue.number};
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const previous = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes(marker));
            if (previous) await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            else await github.rest.issues.createComment({...params, body});
