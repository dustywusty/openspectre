name: Desktop client
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'crates/**'
      - 'assets/open/**'
      - 'Cargo.*'
      - '.cargo/**'
      - 'scripts/package-desktop.py'
      - 'scripts/desktop_release.py'
      - 'scripts/test_desktop_release.py'
      - 'docs/desktop*.md'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'assets/open/**'
      - 'Cargo.*'
      - '.cargo/**'
      - 'scripts/package-desktop.py'
      - 'scripts/desktop_release.py'
      - 'scripts/test_desktop_release.py'
      - 'docs/desktop*.md'
      - '.github/workflows/desktop.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (leave empty to test the selected branch)'
        type: string
        default: ''
      publish:
        description: 'Publish packages to the tag above after every build passes'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      revision: ${{ steps.release.outputs.revision }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_desktop_release.py
      - id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          PUBLISH_REQUESTED: ${{ inputs.publish && 'true' || 'false' }}
        run: python scripts/desktop_release.py prepare
  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: Package ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build and package the target executable
        run: python scripts/package-desktop.py --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            artifacts/desktop/*.zip
            artifacts/desktop/*.tar.gz
          if-no-files-found: error
          retention-days: 14
  collect:
    needs: [prepare, package]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts/release
          merge-multiple: true
      - name: Verify all architectures and write SHA-256 checksums
        env:
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
        run: python scripts/desktop_release.py checksums --directory artifacts/release --revision "$RELEASE_REVISION"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ needs.prepare.outputs.version }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [prepare, collect]
    if: >-
      needs.prepare.outputs.publish == 'true' &&
      (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-${{ needs.prepare.outputs.version }}
          path: artifacts/release
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
        run: >-
          python scripts/desktop_release.py publish --directory artifacts/release
          --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" --repo "$GITHUB_REPOSITORY"
